name: contractcheck

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contractcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check repository contract
        run: python scripts/check_repo_contract.py
